# Scale on in-flight requests rather than CPU.
#
# CPU utilisation is a poor autoscaling signal for a generation service: a pod pinned
# at 100% CPU serving one long request looks identical to a pod serving eight short
# ones, but only the second is actually saturated. `lmops_requests_in_flight` measures
# queue pressure directly, which is what admission control is already gating on.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lmops-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lmops-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Pods
      pods:
        metric:
          name: lmops_requests_in_flight
        target:
          type: AverageValue
          averageValue: "3"
  behavior:
    scaleDown:
      # Generation traffic is bursty; a slow scale-down avoids thrashing.
      stabilizationWindowSeconds: 300
