# Larger configuration for a GPU: ~11M parameters, 256-token context.
#
# Not exercised by CI and not the source of any reported number. Measured on the
# laptop CPU used for the reference run it trains at roughly 800 tokens/sec, which is
# about four hours for 2000 steps -- hence configs/small.yaml being the baseline.
model:
  vocab_size: 1024
  n_layer: 6
  n_head: 6
  n_kv_head: 6
  d_model: 384
  max_seq_len: 256
  dropout: 0.1
  rope_theta: 10000.0
  tie_embeddings: true

data:
  data_dir: data/processed
  tokenizer_path: data/processed/tokenizer.json
  batch_size: 24
  seq_len: 256

optim:
  lr: 0.0006
  min_lr_ratio: 0.1
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_steps: 100

train:
  max_steps: 2000
  grad_accum_steps: 1
  eval_interval: 200
  eval_batches: 20
  log_interval: 25
  checkpoint_interval: 500
  seed: 1337
  device: auto
  dtype: auto
  out_dir: runs/medium
